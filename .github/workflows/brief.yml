name: market-brief

on:
  schedule:
    # 05:30 UTC Monday and Thursday = 07:30 Madrid in summer, 06:30 in winter. GitHub may delay cron by some minutes.
    - cron: "30 5 * * 1,4"
  workflow_dispatch:
    inputs:
      send:
        description: "Send the email"
        default: "true"

permissions:
  contents: write

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Generate and send brief
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BRIEF_MODEL: ${{ vars.BRIEF_MODEL || 'claude-sonnet-4-6' }}
          SMTP_HOST: ${{ vars.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ vars.SMTP_PORT || '465' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          if [ "${{ github.event.inputs.send || 'true' }}" = "true" ]; then
            python -m brief run --send
          else
            python -m brief run
          fi
      - name: Persist estimate snapshot and last brief
        run: |
          git config user.name "brief-bot"
          git config user.email "brief-bot@users.noreply.github.com"
          git add state/
          git commit -m "state: $(date -u +%F)" || echo "no changes"
          git push
